<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Android 系统应用卸载器</title>
<style>
:root{
  --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
  --text:#e6e9ef; --muted:#8b93a7; --accent:#4f8cff; --danger:#ff5d5d;
  --warn:#ffb020; --ok:#35c98a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
 font:13px/1.5 -apple-system,"Segoe UI","Microsoft YaHei",Arial,"Helvetica Neue",sans-serif;}
header{display:flex;align-items:center;gap:16px;padding:14px 20px;
 background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.3px}
h1 span{color:var(--muted);font-weight:400;font-size:12px;margin-left:8px}
.grow{flex:1}
select,input,button{font:inherit;color:var(--text);background:var(--panel2);
 border:1px solid var(--line);border-radius:8px;padding:6px 10px;outline:none}
select:focus,input:focus{border-color:var(--accent)}
button{cursor:pointer;transition:.15s}
button:hover{border-color:var(--accent);color:#fff}
button:disabled{opacity:.45;cursor:not-allowed}
.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.primary:hover{background:#6a9dff}
.danger{background:var(--danger);border-color:var(--danger);color:#fff;font-weight:600}
.danger:hover{background:#ff7a7a}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 20px;
 border-bottom:1px solid var(--line);background:var(--panel)}
.chip{padding:5px 12px;border-radius:999px;border:1px solid var(--line);
 background:var(--panel2);color:var(--muted);cursor:pointer}
.chip.on{background:rgba(79,140,255,.16);border-color:var(--accent);color:#cfe0ff}
#search{width:220px}
.stat{margin-left:auto;color:var(--muted);font-size:12px}
.stat b{color:var(--text);font-weight:600}
.wrap{padding:0 12px 90px;overflow-x:auto}
table{width:100%;min-width:760px;border-collapse:collapse;table-layout:fixed}
thead th{background:var(--panel2);
 text-align:left;font-weight:500;color:var(--muted);font-size:12px;
 padding:10px 10px;border-bottom:1px solid var(--line)}
tbody td{padding:8px 10px;border-bottom:1px solid rgba(42,47,58,.6);vertical-align:middle;
 overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
tbody tr:hover{background:rgba(79,140,255,.05)}
tbody tr.locked{opacity:.5}
.name{color:var(--text);font-weight:500}
.pkg{color:var(--muted);font-family:Consolas,monospace;font-size:11.5px}
.mem{font-family:Consolas,monospace;color:#9ad0ff}
.tag{display:inline-block;padding:1px 7px;border-radius:6px;font-size:11px;border:1px solid}
.tag.sys{color:#c9a6ff;border-color:#5a4a7a}
.tag.usr{color:#8ce7b6;border-color:#2f6a4f}
.tag.off{color:var(--warn);border-color:#6a5626}
.tag.lock{color:var(--danger);border-color:#6a2d2d}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;gap:14px;
 padding:12px 20px;background:rgba(23,26,33,.96);border-top:1px solid var(--line);
 backdrop-filter:blur(8px);z-index:20}
.bar .sel{color:var(--muted)}
.bar .sel b{color:var(--accent);font-size:16px;margin:0 3px}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;
 align-items:center;justify-content:center;z-index:50}
.mask.on{display:flex}
.modal{width:520px;max-height:76vh;overflow:auto;background:var(--panel);
 border:1px solid var(--line);border-radius:14px;padding:20px;
 box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal h2{margin:0 0 12px;font-size:15px}
.modal ul{margin:0 0 14px;padding-left:18px;color:var(--muted);max-height:34vh;overflow:auto;
 font-family:Consolas,monospace;font-size:12px}
.modal .note{background:rgba(255,93,93,.1);border:1px solid rgba(255,93,93,.35);
 border-radius:8px;padding:10px 12px;color:#ffb3b3;font-size:12px;margin-bottom:14px}
.modal .row{display:flex;gap:10px;justify-content:flex-end;align-items:center}
.check{display:flex;align-items:center;gap:8px;color:var(--muted);margin-right:auto;font-size:12px}
.toast{position:fixed;right:20px;bottom:80px;max-width:420px;max-height:44vh;overflow:auto;
 background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;
 font-family:Consolas,monospace;font-size:12px;display:none;z-index:60;
 box-shadow:0 10px 30px rgba(0,0,0,.5)}
.toast.on{display:block}
.toast .l{color:var(--muted)}
.toast .l.ok{color:var(--ok)}
.toast .l.bad{color:var(--danger)}
.empty{padding:60px;text-align:center;color:var(--muted)}
.spin{padding:40px;text-align:center;color:var(--muted)}
@media (max-width:900px){
  table{min-width:0}
  thead th:last-child,tbody td:last-child{display:none}
  thead th:nth-child(2){width:104px !important}
  thead th:nth-child(3){width:168px !important}
  thead th:nth-child(4){width:58px !important}
  thead th:nth-child(5){width:80px !important}
  #search{width:150px}
}
</style>
</head>
<body>
<header>
  <h1>Android 系统应用卸载器<span>ADB · 仅本机 127.0.0.1</span></h1>
  <div class="grow"></div>
  <select id="device" title="选择设备"></select>
  <button id="refresh">刷新</button>
</header>

<div class="toolbar">
  <button class="chip on" data-filter="all">全部</button>
  <button class="chip" data-filter="sys">系统应用</button>
  <button class="chip" data-filter="usr">第三方</button>
  <button class="chip" data-filter="run">运行中</button>
  <button class="chip" data-filter="sel">已选</button>
  <input id="search" placeholder="搜索名称 / 包名">
  <div class="stat" id="stat"></div>
</div>

<div class="wrap">
  <table>
    <thead>
      <tr>
        <th style="width:38px"><input type="checkbox" id="all"></th>
        <th style="width:140px">名称</th>
        <th style="width:210px">包名</th>
        <th style="width:80px">类型</th>
        <th style="width:86px">内存</th>
        <th style="min-width:200px">APK 路径</th>
      </tr>
    </thead>
    <tbody id="rows"><tr><td colspan="6" class="spin">正在读取设备列表…</td></tr></tbody>
  </table>
</div>

<div class="bar">
  <div class="sel">已选 <b id="cnt">0</b> 个</div>
  <div class="grow"></div>
  <button class="danger" id="go" disabled>卸载选中</button>
</div>

<div class="mask" id="mask">
  <div class="modal">
    <h2>确认卸载</h2>
    <div class="note">本机禁用「停用」通道，卸载只能通过恢复出厂设置找回，无法命令级回滚。</div>
    <ul id="confirmList"></ul>
    <div class="row">
      <label class="check"><input type="checkbox" id="ack"> 我确认这些应用不可恢复</label>
      <button id="cancel">取消</button>
      <button class="danger" id="confirm" disabled>确认卸载</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let PKGS = [], FILTER = 'all', SERIAL = '', SEL = new Set();

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mb = kb => kb >= 1024 ? (kb / 1024).toFixed(1) + ' MB' : (kb ? kb + ' KB' : '-');

async function api(path, opt) {
  const r = await fetch(path, opt);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

async function loadDevices() {
  const devs = await api('/api/devices');
  const sel = $('#device');
  sel.innerHTML = devs.map(d => `<option value="${esc(d.serial)}">${esc(d.model || d.serial)} · ${esc(d.serial)}</option>`).join('')
    || '<option value="">未检测到设备</option>';
  if (devs.length) { SERIAL = devs[0].serial; await loadPackages(); }
  else { $('#rows').innerHTML = '<tr><td colspan="6" class="empty">未检测到已授权设备，请连接 USB 并允许调试</td></tr>'; }
}

async function loadPackages() {
  if (!SERIAL) return;
  $('#rows').innerHTML = '<tr><td colspan="6" class="spin">正在读取包列表与内存占用…</td></tr>';
  SEL.clear(); updateBar();
  const t0 = performance.now();
  PKGS = await api('/api/packages?serial=' + encodeURIComponent(SERIAL));
  render();
  console.log('load ms', Math.round(performance.now() - t0));
}

function view() {
  const kw = $('#search').value.trim().toLowerCase();
  return PKGS.filter(p => {
    if (FILTER === 'sys' && !p.system) return false;
    if (FILTER === 'usr' && p.system) return false;
    if (FILTER === 'run' && !p.memKb) return false;
    if (FILTER === 'sel' && !SEL.has(p.pkg)) return false;
    if (kw && !(p.pkg.toLowerCase().includes(kw) || (p.label || '').toLowerCase().includes(kw))) return false;
    return true;
  });
}

function render() {
  const list = view();
  const run = PKGS.filter(p => p.memKb).length;
  const totalMem = PKGS.reduce((a, p) => a + p.memKb, 0);
  $('#stat').innerHTML = `共 <b>${PKGS.length}</b> 个包 · 运行中 <b>${run}</b> · 累计占用 <b>${mb(totalMem)}</b>`;
  if (!list.length) {
    $('#rows').innerHTML = '<tr><td colspan="6" class="empty">没有匹配项</td></tr>';
    return;
  }
  $('#rows').innerHTML = list.map(p => {
    const checked = SEL.has(p.pkg) ? 'checked' : '';
    const lock = p.protected;
    return `<tr class="${lock ? 'locked' : ''}">
      <td><input type="checkbox" data-pkg="${esc(p.pkg)}" ${checked} ${lock ? 'disabled' : ''}></td>
      <td class="name">${esc(p.label || p.pkg)}</td>
      <td class="pkg" title="${esc(p.pkg)}">${esc(p.pkg)}</td>
      <td><span class="tag ${p.system ? 'sys' : 'usr'}">${p.system ? '系统' : '三方'}</span>
          ${p.disabled ? '<span class="tag off">已停用</span>' : ''}
          ${lock ? '<span class="tag lock">锁定</span>' : ''}</td>
      <td class="mem">${mb(p.memKb)}</td>
      <td class="pkg" title="${esc(p.path)}">${esc(p.path)}</td>
    </tr>`;
  }).join('');
}

function updateBar() {
  $('#cnt').textContent = SEL.size;
  $('#go').disabled = SEL.size === 0;
}

$('#rows').addEventListener('change', e => {
  const cb = e.target;
  if (cb.type !== 'checkbox') return;
  const pkg = cb.dataset.pkg;
  cb.checked ? SEL.add(pkg) : SEL.delete(pkg);
  updateBar();
});

$('#all').addEventListener('change', e => {
  const on = e.target.checked;
  view().forEach(p => { if (p.protected) return; on ? SEL.add(p.pkg) : SEL.delete(p.pkg); });
  render(); updateBar();
});

document.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => {
  document.querySelectorAll('.chip').forEach(x => x.classList.remove('on'));
  c.classList.add('on');
  FILTER = c.dataset.filter;
  render();
}));

$('#search').addEventListener('input', render);

$('#device').addEventListener('change', e => { SERIAL = e.target.value; loadPackages(); });
$('#refresh').addEventListener('click', loadPackages);

$('#go').addEventListener('click', () => {
  const list = [...SEL];
  $('#confirmList').innerHTML = list.map(p => `<li>${esc(p)}</li>`).join('');
  $('#ack').checked = false;
  $('#confirm').disabled = true;
  $('#mask').classList.add('on');
});

$('#ack').addEventListener('change', e => { $('#confirm').disabled = !e.target.checked; });
$('#cancel').addEventListener('click', () => $('#mask').classList.remove('on'));

$('#confirm').addEventListener('click', async () => {
  const list = [...SEL];
  $('#mask').classList.remove('on');
  $('#confirm').disabled = true;
  $('#go').disabled = true;
  $('#go').textContent = '卸载中…';
  let res = [];
  try {
    res = await api('/api/uninstall', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({serial: SERIAL, packages: list})
    });
  } catch (e) {
    res = list.map(p => ({pkg: p, ok: false, msg: '请求失败: ' + e.message}));
  }
  const ok = res.filter(r => r.ok).length;
  $('#toast').innerHTML = `<div class="l">卸载完成：成功 ${ok} / ${res.length}</div>` +
    res.map(r => `<div class="l ${r.ok ? 'ok' : 'bad'}">${r.ok ? '✔' : '✘'} ${esc(r.pkg)} <span class="l">${esc(r.msg)}</span></div>`).join('');
  $('#toast').classList.add('on');
  setTimeout(() => $('#toast').classList.remove('on'), 8000);
  $('#go').textContent = '卸载选中';
  await loadPackages();
});

loadDevices();
</script>
</body>
</html>
